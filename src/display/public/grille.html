<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudoku</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <div class="controls">
        <select id="select">
          <option value="hard">difficile</option>
          <option value="very easy">très facile</option>
          <option value="easy">facile</option>
          <option value="medium">moyen</option>
          <option value="extreme">très difficile</option>
          <option value="god">impossible</option>
        </select>

        <button id="solveSV">show solutinon of board with start value</button>
        <button id="solveP">show solutinon of board with this postion</button>
        <button id="NullBoard">create an empty board</button>
        <button id="printBoard">print board</button>
        <button id="reload" onclick="location.reload()">relaod the page</button>
        <label><input type="checkbox" id="inputContent">show number in case</label>
    </div>
    <div id="mattrice"></div>
    <script type="module" src="./index.js"></script>
</body>
</html>
